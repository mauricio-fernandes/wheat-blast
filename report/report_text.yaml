      very_high: "O modelo indica pressão de infecção muito alta. Medidas de proteção devem ser avaliadas rapidamente com orientação técnica local, com prioridade para lavouras no espigamento e início do enchimento de grãos."
      extreme: "O modelo indica pressão de infecção extrema. As condições são muito favoráveis à brusone do trigo; busque imediatamente orientação técnica local sobre proteção e monitoramento de todas as lavouras em risco."
  text:
    summary: "Para **%s** (semeadura em %s, simulação até %s) o modelo indica um pico de infecção dos grãos de **%s** unidades relativas em %s, o que corresponde à classe de risco %s. O valor simulado mais recente (%s) é %s unidades relativas, classe de risco %s. Antese: %s."
    scale: "As classes de risco são atribuídas a partir da infecção simulada dos grãos, expressa em unidades relativas do modelo. Os limites das classes são preliminares e não foram calibrados com dados de campo. Um valor exatamente igual a um limite pertence à classe mais alta."
    site: "A simulação usou clima diário resumido a partir de dados horários para latitude %s, longitude %s (fuso horário %s; modo de clima: %s). Chuva, temperatura e o número de horas por dia com umidade relativa alta determinam a água do solo, o desenvolvimento da cultura e a infecção."
    model: "O modelo combina um balanço hídrico do solo, o desenvolvimento da cultura por tempo térmico e um modelo epidêmico da brusone do trigo. Cultivar: %s; suscetibilidade: %s (0 = resistente, 1 = altamente suscetível). O balanço hídrico usa %s camadas."
    soil: "Capacidade de campo (CC) e ponto de murcha (PM) das camadas de solo usadas no balanço hídrico."
    phenology: "Os estádios da cultura são previstos a partir do tempo térmico acumulado. O espigamento e o início do enchimento de grãos são o período em que as espigas ficam mais expostas à brusone."
    disease: "Pico de esporos no ar: %s; pico de esporos nos grãos: %s (unidades relativas)."
    conditions: "A infecção de folhas e espigas exige uma temperatura favorável e um período úmido de pelo menos %s horas por dia com umidade relativa de %s%% ou mais. A resposta à temperatura é zero em %s °C ou menos, um em %s °C e zero em %s °C ou mais. A condição de período úmido foi atendida em %s de %s dias simulados."
    kernel: "A curva mostra a infecção dos grãos em unidades relativas, com as faixas das classes de risco ao fundo. Os valores podem diminuir após um pico porque o modelo inclui um termo de recuperação."
    forecast_intro: "Na janela de previsão (%s a %s), a infecção dos grãos passa de %s para %s unidades relativas (variação %s). As condições de infecção (período de espigamento, temperatura favorável e período úmido) foram atendidas em %s dias de previsão. Maior valor na janela: %s (classe %s)."
    forecast_blocks: "A janela de previsão é resumida em períodos de até %s dias."
    forecast_key_days: "Dias em que todas as condições de infecção foram atendidas: %s."
    forecast_none: "Nenhum dia de previsão foi simulado: a execução não passou do clima observado disponível."
    interpretation: "A classe de risco baseia-se no pico de infecção dos grãos simulado em todo o período; o valor mais recente e a janela de previsão mostram a situação atual da epidemia."
    limits: "A infecção dos grãos é expressa em unidades relativas do modelo, não como porcentagem de espigas ou grãos infectados. Os limites das classes são preliminares. A infecção exige temperatura média diária favorável e pelo menos %s horas por dia com umidade relativa de %s%% ou mais; esses limiares não estão calibrados. A temperatura média diária é apenas uma aproximação da temperatura durante as horas úmidas. A incerteza da previsão aumenta com o prazo. Dias de clima preenchidos por interpolação: %s."
    conclusion: "Para %s o pico simulado de infecção dos grãos é %s unidades relativas, classe de risco %s. Antese: %s."
    disclaimer: "Este relatório é produzido por um modelo de simulação e é apenas indicativo. Ele não substitui o monitoramento em campo nem as recomendações técnicas locais."
  recs:
    - "Monitore espigas e grãos a partir do espigamento, principalmente após períodos quentes e úmidos."
    - "Use este relatório junto com observações de campo e recomendações técnicas locais; as classes são relativas, não uma incidência calibrada."
    - "Repita a simulação quando novas previsões do tempo estiverem disponíveis."
    - "Considere a suscetibilidade da cultivar e a data de semeadura ao comparar lavouras."
