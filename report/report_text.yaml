      moderate: "O modelo indica pressão de infecção moderada. Intensifique o monitoramento das espigas no espigamento e no início do enchimento de grãos, acompanhe a previsão de períodos quentes e úmidos e discuta com um agrônomo local se a proteção se justifica em cultivares suscetíveis."
