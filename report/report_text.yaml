  risk:
    labels: {none: "None", low: "Low", moderate: "Moderate", high: "High", very_high: "Very high", extreme: "Extreme (severe)"}
    desc:
      none: "No relevant infection is expected."
      low: "Low infection pressure."
      moderate: "Moderate infection pressure; heightened attention."
      high: "High infection pressure; alert."
      very_high: "Very high infection pressure; protective measures should be evaluated."
      extreme: "Extreme infection pressure; conditions are highly conducive."
    advice:
      none: "The model indicates no relevant infection. Keep routine scouting, especially from heading onward."
      low: "The model indicates low infection pressure. Keep routine scouting of spikes from heading; no specific action is indicated by the model."
      moderate: "The model indicates moderate infection pressure. Intensify scouting of spikes at heading and early grain fill, follow the weather outlook for warm and wet spells, and discuss with a local agronomist whether protection is justified for susceptible cultivars."
      high: "The model indicates high infection pressure. Treat this as an alert: inspect fields frequently, prioritise susceptible cultivars and fields at or near heading, and consult a local agronomist about protective measures and their timing."
      very_high: "The model indicates very high infection pressure. Protective measures should be evaluated promptly with local technical advice, with priority for fields at heading and early grain fill."
      extreme: "The model indicates extreme infection pressure. Conditions are highly conducive to wheat blast; seek local technical advice immediately about protection and monitoring of all fields at risk."
  text:
    summary: "For **%s** (sowing on %s, simulation until %s) the model gives a peak kernel infection of **%s** relative units on %s, which corresponds to the risk class %s. The latest simulated value (%s) is %s relative units, risk class %s. Anthesis: %s."
    scale: "Risk classes are assigned from the simulated kernel infection, expressed in relative model units. The class limits are preliminary and have not been calibrated against field data. A value exactly at a limit belongs to the higher class."
    site: "The simulation used daily weather summarised from hourly data for latitude %s, longitude %s (time zone %s; weather mode: %s). Rain, temperature and the number of hours per day with high relative humidity drive soil water, crop development and infection."
    model: "The model combines a soil water balance, thermal-time crop development and a wheat blast epidemic model. Cultivar: %s; susceptibility: %s (0 = resistant, 1 = highly susceptible). The soil water balance uses %s layers."
    soil: "Field capacity (FC) and wilting point (WP) of the soil layers used in the water balance."
    phenology: "Crop development stages are predicted from accumulated thermal time. Heading and early grain fill are the period in which spikes are most exposed to wheat blast."
    disease: "Peak airborne spore load: %s; peak spore load on kernels: %s (relative units)."
    conditions: "Infection of leaves and spikes needs both a favorable temperature and a wet period of at least %s hours per day with relative humidity of %s%% or more. The temperature response is zero at or below %s °C, one at %s °C and zero at or above %s °C. The wet-period condition was met on %s of %s simulated days."
    kernel: "The curve shows kernel infection in relative units with the risk class bands in the background. Values can decline after a peak because the model includes a recovery term."
    forecast_intro: "For the forecast window (%s to %s), kernel infection changes from %s to %s relative units (change %s). The infection conditions (heading period, favorable temperature and wet period) were met on %s forecast days. Highest value in the window: %s (class %s)."
    forecast_blocks: "The forecast window is summarised in periods of up to %s days."
    forecast_key_days: "Days on which all infection conditions were met: %s."
    forecast_none: "No forecast days were simulated: the run did not extend beyond the available observed weather."
    interpretation: "The risk class is based on the peak simulated kernel infection of the whole period; the latest value and the forecast window show where the epidemic stands now."
    limits: "Kernel infection is expressed in relative model units, not as a percentage of infected spikes or kernels. The class limits are preliminary. Infection requires a favorable daily mean temperature and at least %s hours per day with relative humidity of %s%% or more; these thresholds are not calibrated. Daily mean temperature is only a proxy for the temperature during wet hours. Forecast uncertainty grows with lead time. Weather days filled by interpolation: %s."
    conclusion: "For %s the peak simulated kernel infection is %s relative units, risk class %s. Anthesis: %s."
    disclaimer: "This report is produced by a simulation model and is indicative only. It does not replace field scouting or local technical recommendations."
  recs:
    - "Scout spikes and kernels from heading onward, particularly after warm and wet spells."
    - "Use this report together with field observations and local technical recommendations; the classes are relative, not a calibrated incidence."
    - "Repeat the simulation when new weather forecasts become available."
    - "Consider cultivar susceptibility and sowing date when comparing fields."
